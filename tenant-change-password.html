<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Change password · Bords</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-client.js" defer></script>
    <script src="password-visibility.js" defer></script>
    <script src="tenant-change-password.js" defer></script>
  </head>
  <body>
    <main class="login-screen" aria-labelledby="change-password-title">
      <section class="login-card">
        <a class="brand login-brand" href="tenant.html" aria-label="Bords tenant portal">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span class="brand-copy"><strong>Bords</strong></span>
        </a>
        <span class="panel-label">TENANT ACCOUNT</span>
        <h1 id="change-password-title">Change your password</h1>
        <p class="login-intro">Confirm your current password, then choose a new one.</p>
        <form id="tenant-change-password-form">
          <label class="login-field" for="current-password">Current password
            <span class="password-field-control">
              <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />
              <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="current-password" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <label class="login-field" for="new-password">New password
            <span class="password-field-control">
              <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
              <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="new-password" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <label class="login-field" for="confirm-password">Confirm new password
            <span class="password-field-control">
              <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
              <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="confirm-password" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <button class="button button-primary login-continue" type="submit">Update password</button>
        </form>
        <p class="login-feedback" id="tenant-change-password-feedback" role="status" aria-live="polite"></p>
        <a class="auth-link" href="tenant.html">Back to tenant portal</a>
      </section>
    </main>
  </body>
</html>
