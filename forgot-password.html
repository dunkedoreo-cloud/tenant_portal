<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Reset password · Bords</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-client.js" defer></script>
    <script src="forgot-password.js" defer></script>
  </head>
  <body>
    <main class="login-screen" aria-labelledby="reset-request-title">
      <section class="login-card">
        <a class="brand login-brand" href="index.html" aria-label="Bords home">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span class="brand-copy"><strong>Bords</strong></span>
        </a>
        <span class="panel-label">ACCOUNT HELP</span>
        <h1 id="reset-request-title">Reset your password</h1>
        <p class="login-intro">Enter the email address for your account. We’ll send you a link to choose a new password.</p>
        <form id="reset-request-form">
          <label class="login-field" for="reset-email">Email
            <input id="reset-email" name="email" type="email" autocomplete="email" required />
          </label>
          <button class="button button-primary login-continue" type="submit">Send reset link</button>
        </form>
        <p class="login-feedback" id="reset-request-feedback" role="status" aria-live="polite"></p>
        <a class="auth-link" href="index.html">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
