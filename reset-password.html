<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Choose a new password · Bords</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-client.js" defer></script>
    <script src="password-visibility.js" defer></script>
    <script src="reset-password.js" defer></script>
  </head>
  <body>
    <main class="login-screen" aria-labelledby="new-password-title">
      <section class="login-card">
        <a class="brand login-brand" href="index.html" aria-label="Bords home">
          <span class="brand-mark" aria-hidden="true">B</span>
          <span class="brand-copy"><strong>Bords</strong></span>
        </a>
        <span class="panel-label">ACCOUNT HELP</span>
        <h1 id="new-password-title">Choose a new password</h1>
        <p class="login-intro" id="reset-password-intro">Use the password reset link from your email to continue.</p>
        <form id="new-password-form" hidden>
          <label class="login-field" for="new-password">New password
            <span class="password-field-control">
              <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="6" required />
              <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="new-password" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <label class="login-field" for="confirm-password">Confirm new password
            <span class="password-field-control">
              <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />
              <button class="password-visibility-toggle" type="button" data-password-toggle aria-controls="confirm-password" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <button class="button button-primary login-continue" type="submit">Update password</button>
        </form>
        <p class="login-feedback" id="reset-password-feedback" role="status" aria-live="polite"></p>
        <a class="auth-link" id="reset-retry-link" href="forgot-password.html" hidden>Request another reset link</a>
        <a class="auth-link" id="reset-success-link" href="index.html" hidden>Go to sign in</a>
        <a class="auth-link" href="index.html">Back to sign in</a>
      </section>
    </main>
  </body>
</html>
